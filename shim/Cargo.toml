[package]
name = "fips-android-shim"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# JNI shim embedding the fips node for the Android app:
# - `cdylib` → libfips_android.so loaded from Kotlin
# - `lib`    → host-side unit/integration tests of the engine, pump, and DNS
#              proxy (everything except the JNI surface itself)
[lib]
name = "fips_android"
crate-type = ["cdylib", "lib"]

[dependencies]
# fips with the Android embedder hooks (app-owned TUN seam, socket-protect,
# TunPacketProcessor, ControlReadHandle::query, ControlCommandHandle,
# show_lan_peers) — the `android-hooks` branch of the fr34aky/fips fork,
# pinned. For local fips development, override with:
#   [patch."https://github.com/fr34aky/fips"]
#   fips = { path = "../fips" }
fips = { git = "https://github.com/fr34aky/fips", rev = "f4a811e", default-features = false }
ipstack = "1"
jni = "0.21"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Loopback websocket server standing in for a relay in the engine test
# (same tungstenite the tree already carries via nostr-sdk; no TLS features).
tungstenite = { version = "0.26", default-features = false }

[profile.release]
strip = true
