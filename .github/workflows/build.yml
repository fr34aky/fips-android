# Build and test on every push and PR.
#
# Exists to enforce two rules CLAUDE.md currently states but nothing checks:
# the fips pin must stay in sync across both manifests and both lockfiles, and
# all three ABIs must build — armeabi-v7a especially, which is the one most
# likely to break on a pin bump (32-bit pointer-width casts) and the one a
# human is least likely to remember to build.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap guards + the host test suite. Runs in a couple of minutes and
  # catches the pin-desync class of mistake before the slow job even starts.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - name: fips pin is in sync across manifests and lockfiles
        run: |
          set -euo pipefail
          rev_of() { grep -oP 'fips = \{ git = "[^"]+", rev = "\K[^"]+' "$1"; }
          shim=$(rev_of shim/Cargo.toml)
          smoke=$(rev_of smoke/Cargo.toml)
          echo "shim/Cargo.toml   rev = $shim"
          echo "smoke/Cargo.toml  rev = $smoke"
          if [ "$shim" != "$smoke" ]; then
            echo "::error::fips rev differs between shim/ and smoke/ Cargo.toml ($shim vs $smoke)"
            exit 1
          fi
          # A bumped Cargo.toml with a stale Cargo.lock builds the OLD fips.
          for lock in shim/Cargo.lock smoke/Cargo.lock; do
            if ! grep -q "rev=$shim#" "$lock"; then
              echo "::error::$lock does not reference rev $shim — run cargo update -p fips"
              exit 1
            fi
            echo "$lock OK"
          done

      - name: ABI list is in sync across the three places that define it
        run: |
          set -euo pipefail
          # build-native.sh, rust-toolchain.toml and the debug abiFilters must
          # agree, or an ABI silently stops being built or packaged.
          from_script=$(grep -oP '^\s+\S+:\K[a-z0-9_-]+' build-native.sh | sort -u)
          from_gradle=$(grep -oP 'abiFilters \+= listOf\(\K[^)]+' \
            android/app/build.gradle.kts | tr -d '" ' | tr ',' '\n' | sort -u)
          echo "build-native.sh : $(echo $from_script)"
          echo "abiFilters      : $(echo $from_gradle)"
          [ "$from_script" = "$from_gradle" ] || {
            echo "::error::ABI list differs between build-native.sh and debug abiFilters"; exit 1; }

      # Host-only system deps. The Android cross-builds need none of this;
      # these are pulled in by fips's Linux-desktop dependencies when the shim
      # is built for the host: libclang for bindgen (rustables), and dbus for
      # libdbus-sys, which fails its pkg-config probe without the dev package.
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          # rust-toolchain.toml pins the real version; this just ensures rustup
          # is present so it can honour the pin.
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, 2026-08-06
        with:
          workspaces: shim -> target

      - name: Host tests (engine, DNS, packet codecs, filter, config)
        run: |
          set -euo pipefail
          export FIPS_LIBCLANG_PATH=$(llvm-config --libdir 2>/dev/null || echo /usr/lib/llvm-18/lib)
          source ./android-env.sh
          cd shim && cargo test --locked

  # The slow one: cross-compile every ABI, then package them into the APK.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1, 2026-09-09
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4, 2026-09-17
        with:
          # Install nothing here. The action's default is 'tools platform-tools', and
          # Google's SDK repository stopped serving the legacy 'tools' package on
          # 2026-09-15 (android-actions/setup-android#537), so that default fails on
          # every cmdline-tools version before our own install step runs. Nothing in
          # this job uses platform-tools either; the packages the build needs are
          # installed explicitly below. Drop the override once upstream's default
          # no longer names 'tools'.
          packages: ''

      - name: Install NDK r27c
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "FIPS_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, 2026-08-06
        with:
          workspaces: shim -> target

      # Builds all three ABIs and drops the .so files into jniLibs. armeabi-v7a
      # is the point of the exercise: it is 32-bit and breaks on pointer-width
      # casts that the 64-bit targets accept.
      - name: Build the shim for every ABI
        run: ./build-native.sh

      - name: Verify page alignment per ABI
        run: |
          set -euo pipefail
          source ./android-env.sh
          for abi in arm64-v8a x86_64; do
            got=$("$NDK_BIN/llvm-readelf" -l "android/app/src/main/jniLibs/$abi/libfips_android.so" \
              | awk '/LOAD/ {print $NF}' | sort -u)
            echo "$abi LOAD alignment: $got"
            [ "$got" = "0x4000" ] || { echo "::error::$abi must be 16 KB aligned"; exit 1; }
          done
          got=$("$NDK_BIN/llvm-readelf" -l android/app/src/main/jniLibs/armeabi-v7a/libfips_android.so \
            | awk '/LOAD/ {print $NF}' | sort -u)
          echo "armeabi-v7a LOAD alignment: $got"
          [ "$got" = "0x1000" ] || { echo "::error::armeabi-v7a must stay 4 KB aligned"; exit 1; }

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.3.0, 2026-08-02
        with:
          gradle-version: '8.7'

      - name: Assemble the debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Confirm every ABI made it into the APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libfips_android.so" \
              || { echo "::error::$abi missing from the debug APK"; exit 1; }
            echo "$abi packaged"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, 2026-04-10
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
