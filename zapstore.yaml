# Zapstore publishing manifest (https://zapstore.dev/docs/publish).
#
# Publish with:
#   SIGN_WITH=<nsec1… | bunker://… | browser> zsp publish zapstore.yaml
#
# Validate without publishing or signing anything:
#   zsp publish --check zapstore.yaml
#
# The icon is left unset deliberately: the repo only carries adaptive-icon
# layers (transparent foreground + monochrome), not a composed square icon, so
# zsp extracting it from the APK gives a better result than either layer.

repository: https://github.com/fr34aky/fips2go
# The publisher's Nostr identity. relay.zapstore.dev only accepts events from
# a pubkey it can find in this file at the repository root, so a new key is
# allowlisted by committing it here. The nsec lives outside the repo (see
# RELEASING.md step 5). This is the key that has published every release so
# far; the relay also enforces one publisher per app id, so changing it means
# asking the Zapstore team to reassign the app (see RELEASING.md).
pubkey: npub1yptpz34agws3z95dqxgvyhwnhkulav5vueryjpzrl32p57euwteqwha52w
website: https://github.com/fr34aky/fips2go
license: MIT

# zsp's default asset ranking favours arm64-v8a and deprioritises the other
# ABIs, which would ship Zapstore users the 17.9 MB arm64 APK — correct for
# almost every phone, but an "app not installed" for anyone else. Pin the
# universal APK instead: one 40.8 MB artifact that installs on every device.
# Drop this line to fall back to arm64-v8a.
match: '.*-universal\.apk$'

name: fips2go
summary: Reach the FIPS mesh from your phone, on the apps you choose

description: |
  fips2go runs a FIPS mesh node on your phone and hands it to the apps you
  pick, over a per-app VPN tunnel. Selected apps reach the mesh **and** keep
  normal internet; every other app on the device is untouched.

  - **Per-app split tunnel.** You choose which apps join the mesh. They get the
    mesh and clearnet at once; nothing else on the phone is affected. With no
    apps selected the tunnel does nothing.
  - **`.fips` names just resolve.** DNS for covered apps is answered in-process
    for `.fips`, and forwarded to your normal resolvers for everything else.
  - **Mesh names.** An address book maps readable names to nodes —
    `home.fips` instead of an npub — for every covered app, and can be synced
    from a node you run.
  - **Public domain names over fips.** A site bound to a mesh node
    (fips-pub-domains) is reached by its ordinary name, verified with DNSSEC
    and pinned; already verified domains, and those with a signed claim on a
    mesh relay, keep resolving with no internet at all. Everything else
    resolves as before.
  - **Default-deny inbound firewall.** Other mesh nodes cannot reach ports your
    apps listen on. Only replies to connections you opened, ICMPv6, and an
    explicit port allowlist get through.
  - **Identity sealed by the Android Keystore**, with backup and restore so it
    survives a reinstall.
  - **Three links into the mesh, not one**, plus optional peer discovery via
    Nostr and your own choice of relays.
  - **FIPS Hotspot.** Auto-joins open Wi-Fi named `!FIPS` to reach nearby
    peers, while your internet stays on your normal network.
  - **LAN discovery (mDNS).** Finds peers on your Wi-Fi and dials them
    directly, with no relay hop.
  - **Survives network changes.** A Wi-Fi to cellular hand-over keeps every
    session and route; peers are re-pinned within a second, no reconnect.
  - **Diagnostics.** Resolve or ping an npub, inspect live peer sessions, and
    read the node log.
  - **In-app updates**, verified against the release checksum. Dark theme by
    default.

  Open source (MIT), no accounts, no telemetry. Requires Android 8.0 or later.

tags:
